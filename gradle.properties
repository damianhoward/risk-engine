org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# The oldest JDK the runtime image may be linked from: the first Temurin 25 build carrying the
# CVE-2026-91403 blocked.certs fix. A floor, not the pin: CI installs the exact pin, and this only
# moves when a release fixes something no image may ship without.
runtime.minimumJdk=25.0.5.1+2
