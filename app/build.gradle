// The runnable live risk view: a dependency-free JDK-HttpServer wrapper over :core's
// RiskReportAssembler. This is the module the deploy pipeline ships (installDist).
plugins {
    id 'com.damianhoward.kotlin-conventions'
    id 'application'
}

group = 'com.damianhoward'
version = '2.0.1'

application {
    applicationName = 'risk-engine'
    mainClass = 'com.damianhoward.riskengine.web.RiskWebServerKt'
}

dependencies {
    implementation project(':core')

    testImplementation deps.hamcrest
    testImplementation deps.playwright
}

// Downloads the Chromium build RiskViewBrowserTest drives (a no-op when already present).
// Wired into test so `check` is self-sufficient — no bespoke CI install step.
tasks.register('installPlaywrightChromium', JavaExec) {
    classpath = configurations.testRuntimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install', '--with-deps', 'chromium'
}

test.dependsOn installPlaywrightChromium

// Only the process entry point (RiskWebServerKt — main() binds the real port and blocks) is
// excluded, like a CLI MainKt. The rest of the web layer — routing, request parsing, JSON — is
// exercised against a loopback HttpServer and counted.
coverageExcludes = ['**/web/RiskWebServerKt.class']

// The release carries its own Java runtime: a jlink image of the modules this service uses, linked
// from the same JDK toolchain the tests run on, so a release and its rollback each bring the runtime
// they were built and probed with, and a box's JDK no longer decides what this service runs on.
// What jdeps reports for the distribution, then jcmd (which brings jdk.attach) and JFR so a running
// service can still be diagnosed. No compiler, no jshell.
def runtimeModules = ['java.base', 'java.management', 'jdk.httpserver', 'jdk.jcmd', 'jdk.jfr']
def toolchainHome = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    .map { it.metadata.installationPath }

abstract class RuntimeImage extends DefaultTask {
    @Input abstract ListProperty<String> getModules()
    // The JDK's identity rather than its tree: the release file names the exact build, and hashing
    // a 300 MB directory on every build would cost more than linking does.
    @Input abstract Property<String> getJdkRelease()
    @Internal abstract DirectoryProperty getJdkHome()
    @Input abstract Property<String> getMinimumJdk()
    @OutputDirectory abstract DirectoryProperty getImage()
    @Inject abstract ExecOperations getExec()

    @TaskAction
    void link() {
        // The image is the JDK it is linked from, so an old JDK is an old runtime in production. On
        // 2026-11-21 CI linked from the runner's cached 25.0.5+8 and the release shipped without
        // the CVE-2026-91403 blocked.certs fix; refusing to link is how that fails here instead.
        def line = jdkRelease.get().readLines().find { it.startsWith('JAVA_RUNTIME_VERSION=') }
        if (line == null) {
            throw new GradleException("${jdkHome.get()}/release names no JAVA_RUNTIME_VERSION, so the JDK cannot be checked against runtime.minimumJdk")
        }
        def linking = Runtime.Version.parse(line.substring(line.indexOf('"') + 1, line.lastIndexOf('"')))
        def floor = Runtime.Version.parse(minimumJdk.get())
        if (linking.compareToIgnoreOptional(floor) < 0) {
            throw new GradleException("Refusing to link the runtime from JDK ${linking}: runtime.minimumJdk is ${floor}.")
        }
        File out = image.get().asFile
        out.deleteDir() // jlink refuses an output directory that already exists
        String jlink = new File(jdkHome.get().asFile, System.getProperty('os.name').startsWith('Windows') ? 'bin/jlink.exe' : 'bin/jlink').path
        // No --generate-cds-archive. It grew the image from 49 to 77 MB, and startup to listening
        // measured the same with and without it (300 to 440 ms either way), so it would cost every
        // deploy 28 MB for nothing this service can show. No --compress either: it shrinks the image
        // on disk but gzips worse in the deploy bundle, which is what crosses the wire.
        exec.exec {
            commandLine jlink, '--add-modules', modules.get().join(','),
                '--strip-debug', '--no-header-files', '--no-man-pages', '--output', out.path
        }
    }
}

// jdeps cannot see reflection, but it does see every module the code links against. A module it
// reports that the image lacks is a NoClassDefFoundError waiting in production, so it fails here.
abstract class RuntimeModulesCheck extends DefaultTask {
    @Input abstract ListProperty<String> getModules()
    @Classpath abstract ConfigurableFileCollection getJars()
    @Internal abstract DirectoryProperty getJdkHome()
    @OutputFile abstract RegularFileProperty getReport()
    @Inject abstract ExecOperations getExec()

    @TaskAction
    void verify() {
        String jdeps = new File(jdkHome.get().asFile, System.getProperty('os.name').startsWith('Windows') ? 'bin/jdeps.exe' : 'bin/jdeps').path
        def stdout = new ByteArrayOutputStream()
        exec.exec {
            commandLine([jdeps, '--multi-release', '25', '--ignore-missing-deps', '--print-module-deps'] + jars.files*.path)
            standardOutput = stdout
        }
        def used = stdout.toString().trim().split(',').collect { it.trim() }.findAll { it }
        def missing = used - modules.get()
        if (missing) {
            throw new GradleException("The code uses ${missing.join(', ')}, which the runtime image does not include. Add them to runtimeModules.")
        }
        report.get().asFile.text = used.join('\n') + '\n'
    }
}

// The distribution as it ships, started through its own launcher and probed. JAVA_HOME points at a
// JDK that does not exist, as the unit points it at the box's: the launcher must ignore it for the
// bundled runtime, and if it ever stops doing so the server never comes up and this fails.
abstract class DistributionSmokeTest extends DefaultTask {
    @InputDirectory @PathSensitive(PathSensitivity.RELATIVE) abstract DirectoryProperty getInstall()
    @Input abstract Property<String> getLauncher()
    @Input abstract ListProperty<String> getPaths()
    @OutputFile abstract RegularFileProperty getLog()

    @TaskAction
    void probe() {
        int port = new ServerSocket(0).withCloseable { it.localPort }
        boolean windows = System.getProperty('os.name').startsWith('Windows')
        File bin = new File(install.get().asFile, 'bin')
        def command = windows ? ['cmd', '/c', new File(bin, "${launcher.get()}.bat").path] : [new File(bin, launcher.get()).path]
        def builder = new ProcessBuilder(command).redirectErrorStream(true).redirectOutput(log.get().asFile)
        builder.environment().put('PORT', port.toString())
        builder.environment().put('JAVA_HOME', new File(temporaryDir, 'no-such-jdk').path)
        Process process = builder.start()
        try {
            String base = "http://127.0.0.1:${port}"
            long deadline = System.nanoTime() + 30_000_000_000L
            while (status("${base}/healthz") != 200) {
                if (!process.alive) {
                    throw new GradleException("the distribution exited with ${process.exitValue()}; see ${log.get().asFile}")
                }
                if (System.nanoTime() > deadline) {
                    throw new GradleException("the distribution did not answer /healthz in 30s; see ${log.get().asFile}")
                }
                Thread.sleep(250)
            }
            paths.get().each { path ->
                int code = status("${base}${path}")
                if (code != 200) {
                    throw new GradleException("${path} answered ${code} on the distribution's own runtime")
                }
            }
        } finally {
            process.descendants().forEach { it.destroy() }
            process.destroy()
            process.waitFor()
        }
    }

    static int status(String url) {
        try {
            def connection = (HttpURLConnection) new URL(url).openConnection()
            connection.connectTimeout = 1000
            connection.readTimeout = 5000
            return connection.responseCode
        } catch (IOException ignored) {
            return -1
        }
    }
}

def runtimeImage = tasks.register('runtimeImage', RuntimeImage) {
    modules = runtimeModules
    jdkHome = toolchainHome
    jdkRelease = toolchainHome.map { it.file('release').asFile.text }
    minimumJdk = providers.gradleProperty('runtime.minimumJdk')
    image = layout.buildDirectory.dir('runtime')
}

def verifyRuntimeModules = tasks.register('verifyRuntimeModules', RuntimeModulesCheck) {
    modules = runtimeModules
    jdkHome = toolchainHome
    jars.from(tasks.named('jar'), configurations.runtimeClasspath)
    report = layout.buildDirectory.file('runtime-modules.txt')
}

distributions.main.contents {
    from(runtimeImage) { into 'runtime' }
}

// Gradle's launchers obey JAVA_HOME, and the unit sets it to the box's JDK. Each is told to prefer
// the release's own runtime, right after it has worked out where the release is.
tasks.named('startScripts') {
    doLast {
        def unix = new File(outputDir, applicationName)
        def unixAnchor = 'APP_HOME=$( cd -P "${APP_HOME:-./}.." > /dev/null && printf \'%s\\n\' "$PWD" ) || exit\n'
        assert unix.text.contains(unixAnchor): 'the Unix launcher changed shape; re-anchor the runtime line'
        unix.text = unix.text.replace(unixAnchor, unixAnchor + '[ -x "$APP_HOME/runtime/bin/java" ] && JAVA_HOME=$APP_HOME/runtime\n')

        def windows = new File(outputDir, "${applicationName}.bat")
        def windowsAnchor = 'for %%i in ("%APP_HOME%") do set APP_HOME=%%~fi\r\n'
        assert windows.text.contains(windowsAnchor): 'the Windows launcher changed shape; re-anchor the runtime line'
        windows.text = windows.text.replace(windowsAnchor, windowsAnchor + 'if exist "%APP_HOME%\\runtime\\bin\\java.exe" set JAVA_HOME=%APP_HOME%\\runtime\r\n')
    }
}

def smokeTestDistribution = tasks.register('smokeTestDistribution', DistributionSmokeTest) {
    install = tasks.named('installDist').map { layout.projectDirectory.dir(it.destinationDir.path) }
    launcher = application.applicationName
    paths = ['/healthz', '/readyz', '/', '/metrics', '/privacy']
    log = layout.buildDirectory.file('smoke-test/distribution.log')
}

tasks.named('check') {
    dependsOn verifyRuntimeModules, smokeTestDistribution
}