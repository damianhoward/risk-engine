// The pure risk library: model, pricing, risk, report. No web, no entry point - this is the
// module published for consumers, on Maven Central as com.damianhoward:risk-engine.
plugins {
    id 'com.damianhoward.kotlin-conventions'
    id 'java-library'
    id 'com.vanniktech.maven.publish'
}

group = 'com.damianhoward'
version = '2.0.1'

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"

    testImplementation deps.hamcrest
    // Property-based testing: a JUnit 5 platform engine, runs alongside ordinary Jupiter tests
    // in the same source set via the existing useJUnitPlatform() -- no separate config needed.
    testImplementation 'net.jqwik:jqwik:1.10.1'
    // Independent implementation the cross-validation tests price against. Test scope only:
    // the pricing in main stays hand-written, Strata never leaks into the library's API.
    testImplementation 'com.opengamma.strata:strata-pricer:2.12.73'
}

// Published to Maven Central by the release workflow when a version is tagged. Central requires
// sources, a javadoc jar and a complete POM, and refuses the upload without them.
mavenPublishing {
    configure(new com.vanniktech.maven.publish.KotlinJvm(new com.vanniktech.maven.publish.JavadocJar.Empty(), true))
    // The repository's name rather than the module's: consumers depend on the risk engine, and
    // "core" says nothing outside this build.
    coordinates('com.damianhoward', 'risk-engine', version.toString())
    publishToMavenCentral(true)
    // Signed where the release workflow supplies a key; it arrives empty everywhere else.
    if (!providers.gradleProperty('signingInMemoryKey').getOrElse('').isBlank()) {
        signAllPublications()
    }
    pom {
        name = 'risk-engine'
        description = 'Option pricing, Greeks, value at risk and PnL attribution for a book of positions.'
        url = 'https://github.com/damianhoward/risk-engine'
        inceptionYear = '2026'
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'repo'
            }
        }
        developers {
            developer {
                id = 'damianhoward'
                name = 'Damian Howard'
                url = 'https://github.com/damianhoward'
            }
        }
        scm {
            url = 'https://github.com/damianhoward/risk-engine'
            connection = 'scm:git:https://github.com/damianhoward/risk-engine.git'
            developerConnection = 'scm:git:ssh://git@github.com/damianhoward/risk-engine.git'
        }
    }
}
